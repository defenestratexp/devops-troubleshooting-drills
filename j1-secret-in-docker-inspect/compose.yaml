services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "tr0ub4dor-horse-battery"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  app:
    build:
      context: .
      args:
        DB_PASSWORD: "tr0ub4dor-horse-battery"
    image: j1-app:drill
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: "tr0ub4dor-horse-battery"
