services:
  db:
    image: postgres:16-alpine
    env_file: db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  api:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    env_file: db.env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: ["sh","-c","psql -h db -U postgres -c 'select 1' >/dev/null 2>&1 && echo 'OK authenticated'"]
