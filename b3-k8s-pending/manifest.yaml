apiVersion: v1
kind: Namespace
metadata:
  name: practice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungry
  namespace: practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hungry
  template:
    metadata:
      labels:
        app: hungry
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh","-c","sleep 3600"]
          resources:
            requests:
              cpu: "64"
              memory: "256Gi"
