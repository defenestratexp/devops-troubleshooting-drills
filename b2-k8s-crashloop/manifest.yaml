apiVersion: v1
kind: Namespace
metadata:
  name: practice
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cfgapp-config
  namespace: practice
data:
  APP_MODE: "production"
  LOG_LEVEL: "info"
  AWS_REGION: "us-west-2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfgapp
  namespace: practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfgapp
  template:
    metadata:
      labels:
        app: cfgapp
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh","-c","echo mode=$APP_MODE level=$LOG_LEVEL region=$AWS_REGION; sleep 3600"]
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: cfgapp-config
                  key: APP_MODE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cfgapp-config
                  key: LOG_LEVEL
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: cfgapp-config
                  key: AWS_REGION
