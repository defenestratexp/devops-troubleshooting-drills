services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: seedpw
      POSTGRES_DB: app
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      retries: 25
  importer:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./app:/app
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: seedpw
      PGDATABASE: app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm i --silent pg >/dev/null 2>&1 && node import.js"
