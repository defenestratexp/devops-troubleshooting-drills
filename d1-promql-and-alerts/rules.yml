groups:
  - name: availability
    rules:
      # (1) Meant to page when a service is erroring. Never fired during a real
      # 20-minute outage in which every request returned 503.
      - alert: ServiceErrors
        expr: rate(http_requests_total{status="500"}[5m]) > 0.05
        for: 30m
        labels: {severity: page}

      # (2) Pages several times a day. Nobody looks at it any more.
      - alert: HighLatency
        expr: http_request_duration_seconds{quantile="0.99"} > 0.3
        labels: {severity: page}

      # (3) Bonus: what is wrong with this one?
      - alert: DiskWillFillSoon
        expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.10
        for: 5m
        labels: {severity: page}
