# The relevant part of the scrape configuration. Note the job name; it was
# changed from "api-service" to "api" in the migration to the new service
# discovery, eleven weeks before the incident.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: api
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: api
        action: keep
