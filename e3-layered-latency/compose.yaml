services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8081:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  api:
    image: node:24-alpine
    working_dir: /app
    volumes: ["./app:/app:ro"]
    command: node server.js
    environment:
      PGHOST: db
      PGPASSWORD: pw
      PGUSER: postgres
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: pw
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 2s
      retries: 20
